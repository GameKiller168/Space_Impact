<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Impact</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space Impact">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="description" content="Space Impact, the shooter of the Nokia 3310, in the browser: rebuilt from the phone's own firmware. A fan-made recreation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='2'%20fill='%23a2ad8a'/%3E%3Cpath%20fill='%23222a1c'%20d='M2%207h6v2H2zM8%206h2v4H8zM10%207h4v2h-4zM4%205h2v2H4zM4%209h2v2H4z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="unit">
  <h1 class="title">Space Impact</h1>

  <div class="screen">
    <svg class="screen-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="screen-outline" clipPathUnits="objectBoundingBox">
          <path d="M .03 .035 C .1 .01 .28 0 .5 0 C .72 0 .9 .01 .97 .035 C .995 .045 1 .06 1 .12 C 1 .36 .997 .68 .982 .85 C .973 .94 .965 .98 .944 .986 C .74 .995 .26 .995 .056 .986 C .035 .98 .027 .94 .018 .85 C .003 .68 0 .36 0 .12 C 0 .06 .005 .045 .03 .035 Z"/>
        </clipPath>
      </defs>
    </svg>
    <div class="screen-frame">
      <div class="screen-glass">
        <canvas id="lcd" role="img" aria-label="Display of the game"></canvas>
      </div>
    </div>
  </div>

  <div class="keys" id="keys" role="group" aria-label="Keys">
    <div class="functions">
      <button type="button" tabindex="-1" data-key="c" class="function-clear" aria-label="C"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5A7.5 7.5 0 1 0 16.5 17.5"/></svg></button>
      <button type="button" tabindex="-1" data-key="scrollUp" class="function-up" aria-label="Scroll up"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5l7-7 7 7"/></svg></button>
      <button type="button" tabindex="-1" data-key="scrollDown" class="function-down" aria-label="Scroll down"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5l7 7 7-7"/></svg></button>
      <button type="button" tabindex="-1" data-key="select" class="function-select" aria-label="Select"><span class="navi-line" aria-hidden="true"></span></button>
    </div>
    <div class="digits">
      <button type="button" tabindex="-1" data-key="1" aria-label="1, fire"><span class="number">1</span><span class="letters voicemail" aria-hidden="true"><svg viewBox="0 0 32 14" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="7" r="5"/><circle cx="24" cy="7" r="5"/><path d="M8 12h16"/></svg></span></button>
      <button type="button" tabindex="-1" data-key="2" aria-label="2"><span class="number">2</span><span class="letters">abc</span></button>
      <button type="button" tabindex="-1" data-key="3" aria-label="3, fire"><span class="number">3</span><span class="letters">def</span></button>
      <button type="button" tabindex="-1" data-key="4" aria-label="4, bonus weapon"><span class="number">4</span><span class="letters">ghi</span></button>
      <button type="button" tabindex="-1" data-key="5" aria-label="5"><span class="number">5</span><span class="letters">jkl</span></button>
      <button type="button" tabindex="-1" data-key="6" aria-label="6, bonus weapon"><span class="number">6</span><span class="letters">mno</span></button>
      <button type="button" tabindex="-1" data-key="7" aria-label="7"><span class="number">7</span><span class="letters">pqrs</span></button>
      <button type="button" tabindex="-1" data-key="8" aria-label="8, up"><span class="number">8</span><span class="letters">tuv</span></button>
      <button type="button" tabindex="-1" data-key="9" aria-label="9"><span class="number">9</span><span class="letters">wxyz</span></button>
      <button type="button" tabindex="-1" data-key="*" aria-label="Star, back"><span class="number star" aria-hidden="true"><svg viewBox="0 0 40 34"><path d="M3 17h34M11 3l18 28M29 3 11 31"/></svg></span><span class="letters plus" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 10h14M10 3v14"/></svg></span></button>
      <button type="button" tabindex="-1" data-key="0" aria-label="0, down"><span class="number">0</span><span class="letters bottom-icon" aria-hidden="true"><svg viewBox="0 0 36 12"><path d="M3 2v7h30V2"/></svg></span></button>
      <button type="button" tabindex="-1" data-key="#" aria-label="Hash, forward"><span class="number">#</span><span class="letters bottom-icon" aria-hidden="true"><svg viewBox="0 0 36 22"><path d="M3 11 18 3l15 8M8 9v10h20V9"/></svg></span></button>
    </div>
  </div>

</main>

<noscript><p class="noscript">Space Impact needs JavaScript.</p></noscript>

<script src="js/config.js"></script>
<script src="js/framebuffer.js"></script>
<script src="js/font.js"></script>
<script src="js/pictures.js"></script>

<script src="js/spaceimpact-assets.js"></script>
<script src="js/texts.js"></script>

<script src="js/screens.js"></script>
<script src="js/save.js"></script>
<script src="js/tones.js"></script>
<script src="js/audio.js"></script>
<script src="js/lcd.js"></script>
<script src="js/input.js"></script>
<script src="js/spaceimpact-levels.js"></script>
<script src="js/spaceimpact-terrain.js"></script>
<script src="js/spaceimpact-tones.js"></script>
<script src="js/spaceimpact-texts.js"></script>
<script src="js/spaceimpact-storage.js"></script>
<script src="js/spaceimpact-classes.js"></script>
<script src="js/spaceimpact-random.js"></script>
<script src="js/spaceimpact-enemies.js"></script>
<script src="js/spaceimpact-contact.js"></script>
<script src="js/spaceimpact-controls.js"></script>
<script src="js/spaceimpact-weapons.js"></script>
<script src="js/spaceimpact-render.js"></script>
<script src="js/spaceimpact-engine.js"></script>
<script src="js/spaceimpact-phone.js"></script>
<script src="js/spaceimpact-app.js"></script>

<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });</script>
</body>
</html>
